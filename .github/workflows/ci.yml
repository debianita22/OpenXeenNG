name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: SDL2 headers
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  oracle:
    name: Differential tests against ScummVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the pinned ScummVM sources and build the oracle
        run: oracle/build.sh
      - name: Oracle and reference-sample tests
        env:
          OPENXEEN_ORACLE: ${{ github.workspace }}/target/oracle/xeen_oracle
          OPENXEEN_REF_DIR: ${{ github.workspace }}/target/scummvm-ref/devtools/create_mm/files/xeen
        run: cargo test -p openxeen-formats -p openxeen-engine -- --nocapture

  web:
    name: Browser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-web.sh
      - run: cargo run -q -p openxeen-tool -- synth /tmp/synth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm install --no-save playwright@1.56
          npx playwright install --with-deps chromium
      - run: node scripts/test-web.cjs dist/web /tmp/synth/xeen.cc
      - uses: actions/upload-artifact@v4
        with:
          name: openxeen-web
          path: dist/web

  libretro:
    name: libretro core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: x86_64-unknown-linux-gnu.2.17
            file: libopenxeen_libretro.so
            out: openxeen_libretro.so
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig: aarch64-unknown-linux-gnu.2.17
            file: libopenxeen_libretro.so
            out: openxeen_libretro.so
          - name: linux-armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            zig: armv7-unknown-linux-gnueabihf.2.17
            file: libopenxeen_libretro.so
            out: openxeen_libretro.so
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            file: openxeen_libretro.dll
            out: openxeen_libretro.dll
          - name: macos
            os: macos-latest
            target: aarch64-apple-darwin
            file: libopenxeen_libretro.dylib
            out: openxeen_libretro.dylib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build (Linux, glibc 2.17 baseline for old handheld firmwares)
        if: matrix.zig
        run: |
          pip install cargo-zigbuild
          cargo zigbuild --release -p openxeen-libretro --target ${{ matrix.zig }}
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release -p openxeen-libretro --target ${{ matrix.target }}
      - name: Smoke test with a minimal C frontend
        if: matrix.name == 'linux-x86_64'
        run: |
          cargo run -q -p openxeen-tool -- synth /tmp/synth
          cc -O2 -o libretro_smoke scripts/libretro_smoke.c -ldl
          ./libretro_smoke target/${{ matrix.target }}/release/${{ matrix.file }} /tmp/synth/xeen.cc
      - name: Package
        shell: bash
        run: |
          mkdir -p pkg
          cp target/${{ matrix.target }}/release/${{ matrix.file }} pkg/${{ matrix.out }}
          cp crates/libretro/openxeen_libretro.info pkg/
      - uses: actions/upload-artifact@v4
        with:
          name: openxeen-libretro-${{ matrix.name }}
          path: pkg

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (Linux, system SDL2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-dev xvfb
          cargo build --release -p openxeen-sdl -p openxeen-tool
      - name: Headless run (Linux)
        if: runner.os == 'Linux'
        run: |
          SDL_AUDIODRIVER=dummy xvfb-run -a target/release/openxeen --frames 30 --screenshot shot.bmp
          test -s shot.bmp
      - name: Build (Windows/macOS, SDL2 built from source and linked statically)
        if: runner.os != 'Linux'
        run: cargo build --release -p openxeen-sdl -p openxeen-tool --features openxeen-sdl/bundled
      - uses: actions/upload-artifact@v4
        with:
          name: openxeen-desktop-${{ runner.os }}
          path: |
            target/release/openxeen
            target/release/openxeen.exe
            target/release/xeentool
            target/release/xeentool.exe
          if-no-files-found: ignore
