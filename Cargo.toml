[workspace]
resolver = "3"
members = [
    "crates/formats",
    "crates/engine",
    "crates/sdl",
    "crates/libretro",
    "crates/web",
    "crates/tool",
]
# The SDL frontend needs the SDL2 development libraries. Build the portable
# parts alone with: cargo build -p openxeenng-engine -p openxeenng-tool ...
default-members = [
    "crates/formats",
    "crates/engine",
    "crates/libretro",
    "crates/tool",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["OpenXeenNG contributors"]

[workspace.dependencies]
openxeenng-formats = { path = "crates/formats" }
openxeenng-engine = { path = "crates/engine" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# The ported rendering code mirrors the original arithmetic on purpose.
needless_range_loop = "allow"
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Debug builds stay fast enough to play: the software renderer is optimised.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.openxeenng-engine]
opt-level = 2
[profile.dev.package.openxeenng-formats]
opt-level = 2
